services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        GROQ_API_KEY: ${GROQ_API_KEY}
    image: zmajstrujmy:latest
    container_name: zmajstrujmy-demo
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - zmajstrujmy-network
      - nginx-proxy-network

networks:
  zmajstrujmy-network:
    driver: bridge
  nginx-proxy-network:
    external: true
    name: nginx-proxy-network
